# Test cases for the judge_batch prompt eval.
# jobs_block mimics what judge_module._build_jobs_block() produces from
# real crawl4ai output, so the eval exercises the same input shape as prod.
- vars:
    case_name: "strong_fit_data_analyst"
    num_jobs: 3
    last_index: 2
    candidate_json: |
      {"name": "Asha Rao", "experience_years": 1.5, "current_role": "Data Analyst",
       "target_roles": ["Data Analyst", "Business Analyst"],
       "skills": ["SQL", "Python", "Excel", "Power BI", "Tableau"],
       "domain": "fintech", "location": "Bangalore", "remote_ok": true,
       "min_salary_lpa": 8, "education": "B.Tech CSE"}
    jobs_block: |
      --- JOB 0 ---
      Data Analyst - Fintech Startup, Bangalore
      We are looking for a Data Analyst with 1-3 years experience.
      Required: SQL, Python, Power BI, Excel. Fintech domain preferred.
      Salary: 7-10 LPA. Hybrid, Bangalore office.

      --- JOB 1 ---
      Senior DevOps Engineer, Remote
      5+ years experience with Kubernetes, Terraform, AWS required.
      This role is fully remote, salary 30-40 LPA.

      --- JOB 2 ---
      Business Analyst - Payments team, Bangalore
      1-2 years experience, SQL and Tableau required, fintech/payments
      background a strong plus. Salary 8-11 LPA. Onsite.

