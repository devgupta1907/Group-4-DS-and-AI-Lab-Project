# =========================================================
# ERROR / EDGE CASES (10) — assertions match observed real behavior
# =========================================================

- description: "Error - Empty query string"
  vars: { query: "", location: "Mumbai", country: "in" }
  assert:
    # API treats empty query as a broad search rather than erroring —
    # just confirm it responds gracefully with a valid jobs array.
    - type: javascript
      value: "Array.isArray(output.jobs)"

- description: "Error - Invalid/unsupported country code"
  vars: { query: "software engineer", location: "Mumbai", country: "xx" }
  assert:
    # Should NOT return a normal successful match list for a bogus country.
    - type: javascript
      value: "output.success === false || !Array.isArray(output.jobs) || output.jobs.length === 0"

- description: "Error - Nonexistent / gibberish location"
  vars: { query: "software engineer", location: "Atlantis", country: "in" }
  assert:
    - type: javascript
      value: "output.success === false && output.job_count === 0"

- description: "Error - Negative limit value"
  vars: { query: "software engineer", location: "Mumbai", country: "in", limit: "-5" }
  assert:
    # FastAPI request validation rejects this before hitting Adzuna —
    # response is a validation-error object, not a jobs payload.
    - type: javascript
      value: "output.detail !== undefined"

- description: "Error - Missing location parameter"
  vars: { query: "software engineer", location: "", country: "in" }
  assert:
    # Location is optional in this API — empty location still succeeds.
    - type: javascript
      value: "output.success === true && Array.isArray(output.jobs)"

- description: "Error - Missing country parameter"
  vars: { query: "software engineer", location: "Mumbai", country: "" }
  assert:
    # Country drives which Adzuna endpoint is hit — expect either a
    # FastAPI validation error or a graceful failure, not a silent 200
    # with real results for an unspecified country.
    - type: javascript
      value: "output.detail !== undefined || output.success === false || !Array.isArray(output.jobs) || output.jobs.length === 0"

- description: "Error - Non-numeric limit value"
  vars: { query: "software engineer", location: "Mumbai", country: "in", limit: "abc" }
  assert:
    # FastAPI request validation should reject a non-integer limit.
    - type: javascript
      value: "output.detail !== undefined"

- description: "Error - Excessively large limit value"
  vars: { query: "software engineer", location: "Mumbai", country: "in", limit: "100000" }
  assert:
    # Either the API caps/rejects an unreasonable limit, or it succeeds
    # but never returns more than a sane page size.
    - type: javascript
      value: "output.detail !== undefined || (Array.isArray(output.jobs) && output.jobs.length <= 100)"

- description: "Error - Special characters / injection attempt in query"
  vars: { query: "'; DROP TABLE jobs; --", location: "Mumbai", country: "in" }
  assert:
    # Must not crash or 500 — should degrade to a normal (possibly empty)
    # jobs response rather than exposing an internal server error.
    - type: javascript
      value: "output.detail === undefined && Array.isArray(output.jobs)"

- description: "Error - Excessively long query string"
  vars: { query: "software engineer developer architect lead principal staff senior manager director vp cto backend frontend fullstack mobile cloud devops sre data ml ai security network embedded", location: "Mumbai", country: "in" }
  assert:
    # A very long but well-formed query should still be handled without
    # erroring out.
    - type: javascript
      value: "output.detail === undefined && Array.isArray(output.jobs)"
