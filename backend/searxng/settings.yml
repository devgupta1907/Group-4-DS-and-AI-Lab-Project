# SearXNG configuration for Autonomous AI Career Agent

use_default_settings: true

general:
  instance_name: "career-agent-search"

search:
  formats:
    - html
    - json

  max_request_timeout: 10.0

  # WHY THIS MATTERS MORE THAN ANYTHING ELSE HERE:
  # Without a region, queries resolve against a generic (largely US/UK
  # weighted) index. That is why a query whose text literally read
  # "accountant jobs in Mumbai" came back with Gorakhpur job-board pages —
  # the engines were not wrong about the words, they simply had no Indian
  # relevance signal to rank on. Job search in this project is
  # India-focused, so say so at the engine level rather than hoping the
  # query string carries it.
  default_lang: "en-IN"

  # Autocomplete is unused by the JSON API this project calls; off by
  # default, stated explicitly so it is not accidentally enabled later.
  autocomplete: ""

server:
  secret_key: "career-agent-local-development-secret"

  # Listen on all interfaces inside Docker
  bind_address: "0.0.0.0"
  port: 8080

  # IMPORTANT:
  # Disable limiter/bot protection for local development.
  limiter: false

  image_proxy: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20

engines:

  # --- Primary: broad, India-capable general indexes ---------------------
  #
  # Previously only mojeek + bing were enabled. Mojeek runs its own small
  # independent crawl with thin Indian coverage, so it was effectively
  # steering results for half of every search. It is kept, but no longer
  # carries the load alone.

  - name: duckduckgo
    disabled: false
    timeout: 6.0

  - name: bing
    disabled: false
    timeout: 6.0

  - name: brave
    disabled: false
    timeout: 6.0

  - name: startpage
    disabled: false
    timeout: 6.0

  # Small independent index. Useful for diversity, poor on Indian job
  # boards — demoted from "primary" to one voice among several.
  - name: mojeek
    disabled: false
    timeout: 6.0

  # --- Unnecessary for job searching -------------------------------------
  - name: wikipedia
    disabled: true

  - name: wikidata
    disabled: true

  - name: currency
    disabled: true

  - name: duckduckgo definitions
    disabled: true
