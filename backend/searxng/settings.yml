# SearXNG configuration for Autonomous AI Career Agent

use_default_settings: true

general:
  instance_name: "career-agent-search"

search:
  formats:
    - html
    - json

  max_request_timeout: 10.0

server:
  secret_key: "career-agent-local-development-secret"

  # Listen on all interfaces inside Docker
  bind_address: "0.0.0.0"
  port: 8080

  # IMPORTANT:
  # Disable limiter/bot protection for local development.
  limiter: false

  image_proxy: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20

engines:

  # Primary
  - name: mojeek
    disabled: false
    timeout: 6.0

  # Secondary
  - name: bing
    disabled: false
    timeout: 6.0

  # Disable engines that commonly CAPTCHA/rate-limit automated requests
  - name: duckduckgo
    disabled: true

  - name: brave
    disabled: true

  - name: startpage
    disabled: true

  # Unnecessary for job searching
  - name: wikipedia
    disabled: true

  - name: wikidata
    disabled: true

  - name: currency
    disabled: true

  # Do NOT add:
  # duckduckgo definitionsdocker stop searxng-core