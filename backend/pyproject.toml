[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.1",
    "langchain-google-genai>=4.3.2",
    "langchain-huggingface>=1.2.2",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "tqdm>=4.70.0",
    "uvicorn>=0.49.0",
    # --- resume_parsing module ---
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "cryptography>=44.0.0",
    "google-genai>=1.0.0",
    "openai>=2.0.0",
    "jsonschema>=4.23.0",
    "pillow>=11.0.0",
    "pydantic-settings>=2.7.0",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "langsmith>=0.10.10",
    "psycopg2-binary>=2.9.12",
    "supabase>=2.31.0",
    "langgraph>=1.2.10",
    "rank-bm25>=0.2.2",
    "crawl4ai>=0.9.2",
    "numpy>=2.5.1",
    "httpx>=0.28.1",
    "playwright>=1.54.0",
    "sentence-transformers>=5.7.0",
    "matplotlib>=3.10.0",
    "plotly>=6.0.0",
    "nbformat>=5.10.0",
]

[project.optional-dependencies]
# Experimental OCR/layout route. The production Docker image excludes this
# unless ENABLE_DOCLING=true is supplied at build time.
docling = ["docling>=2.70"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "import-linter>=2.1",
    "ipykernel>=6.29.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/core",
    "src/db",
    "src/services",
    "src/career_recommendation",
    "src/resume_parsing",
    "src/job_discovery_matching",
    "src/career_report",
]
