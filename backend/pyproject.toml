[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.138.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.1",
    "langchain-google-genai>=4.3.2",
    "langchain-huggingface>=1.2.2",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.1",
    "tqdm>=4.70.0",
    "uvicorn>=0.49.0",
]
[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/core",
    "src/db",
    "src/services",
    "src/career_recommendation",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
